# Prometheus scrape config for the optional `--profile ops` stack.
# Scrapes the API's /metrics endpoint (WI A2, prometheus-net) over the INTERNAL
# docker network only — /metrics is never proxied through the edge Caddy.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: taxi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
