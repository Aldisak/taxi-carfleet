name: Deploy

# Deploys on every push to main: build + push images to GHCR, then SSH to the VPS,
# migrate, roll forward, health-check, and auto-rollback on failure.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push to GHCR

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/taxi-*  — owner is the repo owner, lower-cased by the tag step.
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ── 1. Build + push api / web / caddy / backup images (git-SHA + latest) ────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags (lower-case owner + short SHA)
        id: meta
        run: |
          owner="$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')"
          sha="$(echo '${{ github.sha }}' | cut -c1-12)"
          echo "owner=${owner}"     >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha}"     >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-api:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-web:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push caddy (edge, with DNS + ratelimit plugins)
        uses: docker/build-push-action@v6
        with:
          context: infra/caddy
          file: infra/caddy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-caddy:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-caddy:latest

      - name: Build & push backup
        uses: docker/build-push-action@v6
        with:
          context: infra/backup
          file: infra/backup/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-backup:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/taxi-backup:latest

  # ── 2. SSH to the VPS: record previous tag, migrate, up, health-check, rollback
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # GHCR_TOKEN is a PAT (read:packages) so the VPS can pull private images.
          envs: NEW_TAG
          script: |
            set -euo pipefail
            cd /opt/taxi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"

            # ── Record the CURRENTLY-DEPLOYED tag for rollback ──────────────────
            PREV_TAG="$(grep -E '^API_TAG=' .env | cut -d= -f2 || true)"
            PREV_TAG="${PREV_TAG:-latest}"
            echo "$PREV_TAG" > .previous_tag
            echo "[deploy] previous tag: $PREV_TAG → new tag: $NEW_TAG"

            # ── Point .env at the new tag for all images ────────────────────────
            set_tag() {
              local var="$1" val="$2"
              if grep -qE "^${var}=" .env; then
                sed -i "s|^${var}=.*|${var}=${val}|" .env
              else
                echo "${var}=${val}" >> .env
              fi
            }
            set_tag API_TAG    "$NEW_TAG"
            set_tag WEB_TAG    "$NEW_TAG"
            set_tag CADDY_TAG  "$NEW_TAG"
            set_tag BACKUP_TAG "$NEW_TAG"

            $COMPOSE pull

            # ── Migrate (out-of-band, WI A1 `migrate` subcommand) BEFORE up ────
            $COMPOSE run --rm api migrate

            # ── Roll forward ────────────────────────────────────────────────────
            $COMPOSE up -d

            # ── Health check /health/ready with a 60 s timeout ─────────────────
            ok=0
            for i in $(seq 1 12); do
              if $COMPOSE exec -T api curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
                echo "[deploy] healthy after $((i*5))s"; ok=1; break
              fi
              echo "[deploy] waiting for /health/ready ($((i*5))s)…"; sleep 5
            done

            # ── Auto-rollback to the previous tag on failure ───────────────────
            if [ "$ok" -ne 1 ]; then
              echo "[deploy] HEALTH CHECK FAILED — rolling back to $PREV_TAG"
              set_tag API_TAG    "$PREV_TAG"
              set_tag WEB_TAG    "$PREV_TAG"
              set_tag CADDY_TAG  "$PREV_TAG"
              set_tag BACKUP_TAG "$PREV_TAG"
              $COMPOSE pull
              $COMPOSE up -d
              echo "[deploy] rolled back to $PREV_TAG"
              exit 1
            fi

            echo "[deploy] success at $NEW_TAG"
