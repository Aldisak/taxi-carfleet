name: CI

# Runs on every pull request (and pushes to main so the default branch stays green).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: build (warnings-as-errors) + tests (Testcontainers → real Postgres)
  api:
    name: API build + test
    # ubuntu-latest ships a working Docker daemon, which Testcontainers requires.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore api/Taxi.sln

      - name: Build (warnings as errors)
        run: dotnet build api/Taxi.sln -c Release --no-restore -warnaserror

      - name: Test (Testcontainers)
        # Testcontainers spins up postgres:16-alpine on the runner's Docker daemon.
        run: dotnet test api/Taxi.sln -c Release --no-build --verbosity normal

      - name: Format check (informational)
        continue-on-error: true
        run: dotnet format api/Taxi.sln --verify-no-changes

  # ── Frontend: lint (0 warnings) + typecheck + vitest + build + size budget
  web:
    name: Web lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (max-warnings 0)
        run: npm run lint

      - name: Typecheck
        run: npm run tsc

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run size

  # ── Playwright smoke: the 3 critical cross-role flows against the real harness.
  e2e:
    name: Playwright smoke (3 flows)
    runs-on: ubuntu-latest
    # Needs both stacks to be sane first — cheap fail-fast.
    needs: [api, web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci

      - name: Symlink dotnet for the e2e harness
        # scripts/e2e-api.mjs spawns dotnet via the ABSOLUTE path /usr/local/bin/dotnet
        # (it ignores PATH). actions/setup-dotnet installs to /usr/share/dotnet and only
        # puts it on PATH, so without this symlink the harness spawn ENOENTs before
        # Playwright starts. Not fixable in web/scripts (out of this WI's scope).
        working-directory: .
        run: sudo ln -sf "$(which dotnet)" /usr/local/bin/dotnet

      - name: Install Playwright browser (pinned chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        # scripts/e2e-api.mjs (Playwright webServer) boots docker postgres + `dotnet run`
        # and waits on /health/ready; the Vite dev server is the second webServer entry.
        env:
          CI: "true"
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
